name: Build TWRP 8.1 Legacy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    container:
      image: ubuntu:18.04

    steps:
      - name: Checkout PD1818HF_EX device tree
        uses: actions/checkout@v4

      - name: Prepare legacy build environment
        run: |
          sed -i 's|http://archive.ubuntu.com/ubuntu/|http://old-releases.ubuntu.com/ubuntu/|g' /etc/apt/sources.list
          sed -i 's|http://security.ubuntu.com/ubuntu/|http://old-releases.ubuntu.com/ubuntu/|g' /etc/apt/sources.list

          apt-get update

          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip python2.7 rsync bc cpio \
            openjdk-8-jdk gcc-multilib g++-multilib \
            lib32ncurses5-dev lib32readline-dev lib32z1-dev \
            libncurses5-dev liblz4-tool libxml2 lzop \
            squashfs-tools ccache

          ln -sf /usr/bin/python2.7 /usr/bin/python

          python --version
          java -version

      - name: Install repo
        run: |
          mkdir -p /root/bin

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o /root/bin/repo

          chmod +x /root/bin/repo
          ln -sf /root/bin/repo /usr/local/bin/repo

          repo --version

      - name: Initialize TWRP 8.1
        run: |
          mkdir -p /root/twrp
          cd /root/twrp

          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git \
            -b twrp-8.1

      - name: Sync TWRP source
        run: |
          cd /root/twrp

          repo sync -c \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            --force-sync \
            -j2

      - name: Copy PD1818HF_EX device tree
        run: |
          mkdir -p /root/twrp/device/vivo/PD1818HF_EX

          cp -a "$GITHUB_WORKSPACE"/. \
            /root/twrp/device/vivo/PD1818HF_EX/

      - name: Build recovery
        run: |
          cd /root/twrp

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          source build/envsetup.sh

          lunch omni_PD1818HF_EX-eng

          mka recoveryimage -j2

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: PD1818HF_EX-TWRP-8.1
          path: /root/twrp/out/target/product/PD1818HF_EX/recovery.img
          if-no-files-found: error
